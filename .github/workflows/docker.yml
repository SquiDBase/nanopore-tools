name: Build and push Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tool names to build, or "all"'
        default: 'all'
        required: false
      upstream_ref:
        description: 'Pin the UPSTREAM_REF build-arg (one-off version builds, e.g. a paper version). Requires tag + explicit tools.'
        required: false
      tag:
        description: 'Image tag for a pinned build (e.g. v2.1). Replaces the sha/latest tags. Requires explicit tools.'
        required: false

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect changed tools
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any: ${{ steps.set-matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            uncalled:
              - 'Uncalled/**'
            uncalled4:
              - 'Uncalled4/**'
            rawalign:
              - 'RawAlign/**'
            sigmoni:
              - 'Sigmoni/**'
            rawhash2:
              - 'RawHash2/**'
            sigmap:
              - 'Sigmap/**'
            squigglenet:
              - 'SquiggleNet/**'
            boostnano:
              - 'BoostNano/**'
            riser:
              - 'RISER/**'
            readcurrent:
              - 'ReadCurrent/**'
            deepselectnet-cpu:
              - 'DeepSelectNet/**'
            deepselectnet-gpu:
              - 'DeepSelectNet/**'
            nanodeep:
              - 'NanoDeep/**'
            dorado-v212:
              - 'Dorado/**'
            dorado-v096:
              - 'Dorado/**'

      - name: Build matrix
        id: set-matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TOOLS: ${{ github.event.inputs.tools }}
          DISPATCH_REF: ${{ github.event.inputs.upstream_ref }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          # Pinned builds must name their tools and carry a tag - "all" would
          # stamp every image with one tool's version, and a pinned ref without
          # its own tag would silently overwrite :latest.
          if [[ -n "${DISPATCH_REF}${DISPATCH_TAG}" ]]; then
            if [[ "$DISPATCH_TOOLS" == "all" || -z "$DISPATCH_TOOLS" ]]; then
              echo "::error::upstream_ref/tag require an explicit tools list, not 'all'"; exit 1
            fi
            if [[ -n "$DISPATCH_REF" && -z "$DISPATCH_TAG" ]]; then
              echo "::error::upstream_ref requires a tag (otherwise it would overwrite :latest)"; exit 1
            fi
          fi
          # The inputs land verbatim in image tags and build-args, so they must
          # be single clean tokens: no 'latest' (pinned builds must never move
          # it) and no whitespace/newlines (tag-line or build-arg injection).
          if [[ -n "$DISPATCH_TAG" ]]; then
            if [[ "$DISPATCH_TAG" == "latest" || ! "$DISPATCH_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::tag must be a single valid docker tag, and not 'latest'"; exit 1
            fi
          fi
          if [[ -n "$DISPATCH_REF" ]]; then
            if [[ ! "$DISPATCH_REF" =~ ^[A-Za-z0-9._/-]{1,128}$ ]]; then
              echo "::error::upstream_ref must be a plain git ref (commit sha, tag, or branch)"; exit 1
            fi
            if [[ "$DISPATCH_TOOLS" == *dorado* || "$DISPATCH_TOOLS" == *boostnano* ]]; then
              echo "::error::dorado/boostnano pin DORADO_VERSION/BOOSTNANO_VERSION, not UPSTREAM_REF - upstream_ref would be silently ignored"; exit 1
            fi
          fi
          ALL='[
            {"name":"uncalled","dockerfile":"Uncalled/Dockerfile","context":"Uncalled"},
            {"name":"uncalled4","dockerfile":"Uncalled4/Dockerfile","context":"Uncalled4"},
            {"name":"rawalign","dockerfile":"RawAlign/Dockerfile","context":"RawAlign","target_arch":"x86-64-v3","image_suffix":""},
            {"name":"rawalign","dockerfile":"RawAlign/Dockerfile","context":"RawAlign","target_arch":"x86-64-v4","image_suffix":"-avx512"},
            {"name":"sigmoni","dockerfile":"Sigmoni/Dockerfile","context":"Sigmoni","target_arch":"x86-64-v3","image_suffix":""},
            {"name":"sigmoni","dockerfile":"Sigmoni/Dockerfile","context":"Sigmoni","target_arch":"x86-64-v4","image_suffix":"-avx512"},
            {"name":"rawhash2","dockerfile":"RawHash2/Dockerfile","context":"RawHash2","target_arch":"x86-64-v3","image_suffix":""},
            {"name":"rawhash2","dockerfile":"RawHash2/Dockerfile","context":"RawHash2","target_arch":"x86-64-v4","image_suffix":"-avx512"},
            {"name":"sigmap","dockerfile":"Sigmap/Dockerfile","context":"Sigmap","target_arch":"x86-64-v3","image_suffix":""},
            {"name":"sigmap","dockerfile":"Sigmap/Dockerfile","context":"Sigmap","target_arch":"x86-64-v4","image_suffix":"-avx512"},
            {"name":"squigglenet","dockerfile":"SquiggleNet/Dockerfile","context":"SquiggleNet"},
            {"name":"boostnano","dockerfile":"BoostNano/Dockerfile","context":"BoostNano"},
            {"name":"riser","dockerfile":"RISER/Dockerfile","context":"RISER"},
            {"name":"readcurrent","dockerfile":"ReadCurrent/Dockerfile","context":"ReadCurrent"},
            {"name":"deepselectnet-cpu","dockerfile":"DeepSelectNet/Dockerfile.cpu","context":"DeepSelectNet"},
            {"name":"deepselectnet-gpu","dockerfile":"DeepSelectNet/Dockerfile.gpu","context":"DeepSelectNet"},
            {"name":"nanodeep","dockerfile":"NanoDeep/Dockerfile","context":"NanoDeep"},
            {"name":"dorado-v212","dockerfile":"Dorado/Dockerfile","context":"Dorado","dorado_version":"2.1.2"},
            {"name":"dorado-v096","dockerfile":"Dorado/Dockerfile","context":"Dorado","dorado_version":"0.9.6","dorado_models":"dna_r9.4.1_e8_fast@v3.4 dna_r10.4.1_e8.2_260bps_fast@v4.1.0 dna_r10.4.1_e8.2_400bps_fast@v4.1.0 dna_r10.4.1_e8.2_400bps_fast@v5.0.0 rna002_70bps_fast@v3 rna004_130bps_fast@v5.1.0"}
          ]'

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_TOOLS" == "all" || -z "$DISPATCH_TOOLS" ]]; then
              SELECTED=$(jq -c '.' <<< "$ALL")
            else
              NAMES=$(jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))' <<< "$DISPATCH_TOOLS")
              SELECTED=$(jq -c --argjson n "$NAMES" '[.[] | select(.name as $x | $n | index($x))]' <<< "$ALL")
            fi
          else
            SELECTED=$(jq -c --argjson c "$CHANGES" '[.[] | select(.name as $x | $c | index($x))]' <<< "$ALL")
          fi

          echo "Selected tools:"
          jq -r '.[].name' <<< "$SELECTED" || echo "(none)"
          {
            echo "matrix={\"include\":$SELECTED}"
            echo "any=$(jq 'length > 0' <<< "$SELECTED")"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: ${{ matrix.name }}${{ matrix.image_suffix || '' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: ver
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
          CUSTOM_REF: ${{ github.event.inputs.upstream_ref }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/${{ matrix.name }}${{ matrix.image_suffix || '' }}"
          if [[ -n "$CUSTOM_TAG" ]]; then
            # Pinned one-off build: version tag + unique traceability tag, no :latest.
            # The unique tag includes the upstream ref when overridden, so two
            # dispatches with the same tag but different refs can't collide.
            UNIQUE="${CUSTOM_TAG}-${SHA}"
            REFBIT="${CUSTOM_REF//[^A-Za-z0-9_.-]/-}"   # '/' in branch refs is invalid in a docker tag
            [[ -n "$REFBIT" ]] && UNIQUE="${UNIQUE}-${REFBIT:0:7}"
            TAGS="${IMAGE}:${CUSTOM_TAG}"$'\n'"${IMAGE}:${UNIQUE}"
          else
            TAGS="${IMAGE}:${SHA}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$TAGS"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          provenance: false
          # DORADO_VERSION/DORADO_MODELS only apply to Dorado/Dockerfile - every other
          # matrix entry's dockerfile doesn't declare those ARGs, so buildx prints an
          # unused-build-arg warning for them. That's the price of one Dockerfile
          # shared by both dorado-v212/dorado-v096 instead of two near-identical ones.
          # UPSTREAM_REF is only passed when the dispatch input is set, so the
          # per-Dockerfile defaults keep applying to normal builds.
          build-args: |
            TARGET_ARCH=${{ matrix.target_arch || 'x86-64-v3' }}
            DORADO_VERSION=${{ matrix.dorado_version || '2.1.2' }}
            DORADO_MODELS=${{ matrix.dorado_models || '' }}
            ${{ github.event.inputs.upstream_ref && format('UPSTREAM_REF={0}', github.event.inputs.upstream_ref) || '' }}
          tags: ${{ steps.ver.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.image_suffix || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.image_suffix || '' }}
